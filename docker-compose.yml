services:
  db:
    image: postgis/postgis:15-3.3
    container_name: moscollector_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moscollector}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moscollector}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build: .
    container_name: moscollector_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-moscollector}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-moscollector}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
