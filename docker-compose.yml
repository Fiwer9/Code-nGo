# Перед build: скопируйте .env.example → .env.local (секреты и URL API).
# Для подстановки build-args compose также читает файл `.env` в корне проекта
# (можно: cp .env.local .env или продублировать нужные переменные).

services:
  frontend:
    image: moskollector-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://31.76.44.247:8000}
        NEXT_PUBLIC_YANDEX_MAPS_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
